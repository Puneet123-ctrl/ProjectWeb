<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmetic Products</title>
    <style>
        body {
            background-color: #eaf3fc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        h1 {
            width: 100%;
            background: #004aad;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1200px;
        }
        .product {
            text-align: center;
            flex: 1 1 200px;
            max-width: 200px;
        }
        .product img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .product p {
            margin-top: 8px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Cosmetic Images</h1>
    <div class="gallery">
        <div class="product">
            <img src="Images/Logo.png" alt="Products" />
            <p>Brand Logo</p>
        </div>
        <div class="product">
            <img src="Images/Lipstick.jpeg" alt="Lipstick" />
            <p>Lipstick</p>
        </div>
        <div class="product">
            <img src="Images/Foundation.jpeg" alt="Foundation" />
            <p>Foundation</p>
        </div>
        <div class="product">
            <img src="Images/Perfum.jpeg" alt="Perfume" />
            <p>Perfume</p>
        </div>
        <div class="product">
            <img src="Images/lemon cream.jpeg" alt="Lemon Cream" />
            <p>Lemon Cream</p>
        </div>
        <div class="product">
            <img src="Images/Serum.jpeg" alt="Serum" />
            <p>Serum</p>
        </div>
        <div class="product">
            <img src="Images/LipOil.jpeg" alt="Lip Oil" />
            <p>Lip Oil</p>
        </div>
        <div class="product">
            <img src="Images/Cleaner.jpeg" alt="Acne Cleaner" />
            <p>Acne Cleaner</p>
        </div>
        <div class="product">
            <img src="Images/Estrogen Face Cream.jpeg" alt="Estrogen Cream" />
            <p>Estrogen Face Cream</p>
        </div>
        <div class="product">
            <img src="Images/Cream.jpeg" alt="Cream" />
            <p>Face Cream</p>
        </div>
        <div class="product">
            <img src="Images/GreenTeaSkinCare.jpeg" alt="Green Tea Skincare" />
            <p>Green Tea Skincare</p>
        </div>
    </div>
</body>
