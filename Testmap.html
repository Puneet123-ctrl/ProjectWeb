<div id="info">

</div>
<br />
<br/>
<br />
<br/>
<!-- Timer Section -->
<div id="timer">Time spent on page: <span id="timeSpent">0</span> seconds</div>

<script>
    // Initialize variables
    let timeSpent = 0;
    let timer;

    // Function to start the timer
    function startTimer() {
        timer = setInterval(() => {
            timeSpent++;
            document.getElementById('timeSpent').textContent = timeSpent;
        }, 1000); // Update every second
    }

    // Start the timer when the page loads
    window.onload = startTimer;

    // Stop the timer when the user leaves the page
    window.onbeforeunload = function () {
        clearInterval(timer);
        alert("You spent " + timeSpent + " seconds on this page.");
    }
</script>
</body>
</html>
