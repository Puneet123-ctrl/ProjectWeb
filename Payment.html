 <!DOCTYPE html>

<head>
      <meta charset="UTF-8">
      <title>Payment Page</title>
      <link rel="stylesheet" href="CSS/Payment.css">
      <script src="js/Payment.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Payment Information</h1>
        </header>
    
        <main>
            <section id="paymentSummary">
                <h2>Your Order Total</h2>
                <p>Total: <span id="finalTotal"></span></p>
            </section>
    
            <form id="paymentForm">
                <h2>Billing Address</h2>
                <label for="name">Name:</label>
                <input type="text" id="name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" required><br><br>
                <label for="address">Address:</label>
                <input type="text" id="address" required><br><br>
                <label for="city">City:</label>
                <input type="text" id="city" required><br><br>
                <label for="province">Province:</label>
                <input type="text" id="province"><br><br>
                <label for="postalCode">Postal Code:</label>
                <input type="text" id="postalCode"><br><br>
    
                <h2>Payment Details</h2>
                <label for="cardNumber">Card Number:</label>
                <input type="text" id="cardNumber" pattern="[0-9]{13,19}" placeholder="XXXX-XXXX-XXXX-XXXX" required><br><br>
                <label for="expiryDate">Expiry Date:</label>
                <input type="month" id="expiryDate" required><br><br>
                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" pattern="[0-9]{3,4}" required><br><br>
    
                <button type="submit">Submit Payment</button>
            </form>
        </main>
    </body>
    </html>
