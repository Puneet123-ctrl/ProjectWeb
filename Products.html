
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US" xml:lang="en">
    <!-- Name: Puneet Kaur
      Description: The page Products.html of Menu.html(frames)
      Date: 2025-04-10 -->
<head>
    <title>Select Your Cosmetics</title>
    <link rel="stylesheet" href="CSS/Product.css" type="text/css" />
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Cosmetic Shop</h1>
    <div class="products-list">
        <div class="product">
            <img src="Images/Lipstick.jpeg" alt="Lipstick">
            <h3>Lipstick</h3>
            <p>$12.00</p>
            <button class="add-to-cart" data-product="Lipstick" data-price="12.00">Add to Cart</button>
        </div>
        <div class="product">
            <img src="Images/Foundation.jpeg" alt="Foundation">
            <h3>Foundation</h3>
            <p>$25.00</p>
            <button class="add-to-cart" data-product="Foundation" data-price="25.00">Add to Cart</button>
        </div>
        <div class="product">
            <img src="Images/Mascara.jpg" alt="Mascara">
            <h3>Mascara</h3>
            <p>$18.00</p>
            <button class="add-to-cart" data-product="Mascara" data-price="18.00">Add to Cart</button>
        </div>
        <div class="product">
            <img src="Images/NailPolish.jpg" alt="Nail Polish">
            <h3>Nail Polish</h3>
            <p>$10.00</p>
            <button class="add-to-cart" data-product="Nail Polish" data-price="10.00">Add to Cart</button>
        </div>
        <div class="product">
            <img src="Images/cream.jpeg" alt="cream">
            <h3>cream</h3>
            <p>$15.00</p>
            <button class="add-to-cart" data-product="Cream" data-price="15.00">Add to Cart</button>
        </div>
        <div class="product">
            <img src="Images/SunScreen.jpg" alt="SunScreen">
            <h3>SunScreen</h3>
            <p>$20.00</p>
            <button class="add-to-cart" data-product="SunScreen" data-price="20.00">Add to Cart</button>
        </div>
        <div class="product">
            <img src="Images/Serum.jpeg" alt="Serum">
            <h3>Nail Polish</h3>
            <p>$25.00</p>
            <button class="add-to-cart" data-product="Serum" data-price="25.00">Add to Cart</button>
        </div>
    </div>
</div>

<div class="cart-icon" id="cartIcon">🛒</div>

<div class="sidebar" id="cartSidebar">
    <span class="close-btn" id="closeSidebar">&times;</span>
    <h2>Your Cart</h2>
    <ul id="sidebarCartItems"></ul>
    <div class="summary">
        <p>Subtotal: <span id="subtotal">$0.00</span> CAD</p>
        <p>Shipping: <span id="shipping">$7.00</span> CAD</p>
        <p>Taxes (HST 15%): <span id="taxes">$0.00</span> CAD</p>
        <h3>Total: <span id="orderTotal">$0.00</span> CAD</h3>
    </div>
    <button class="checkout-btn" onclick="window.location.href='payment.html'">Proceed to Checkout</button>
</div>

<script src="js/Product.js"></script>
</body>
</html>
